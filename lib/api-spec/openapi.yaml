openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: follows
    description: Unilateral follows; never grant friend or private-profile access
  - name: notifications
    description: Server-only recipient-scoped internal notifications
paths:
  /chat/conversations:
    get:
      operationId: listChatConversations
      tags: [chat]
      security: [{ sessionCookie: [] }]
      summary: Accessible inbox ordered by last message descending, nulls last, then creation and ID descending
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { in: query, name: cursor, schema: { type: string, maxLength: 512 } }
      responses:
        "200":
          description: Bounded inbox page; use nextCursor for older conversations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatInboxPage" }
        "400": { $ref: "#/components/responses/ChatError" }
        "401": { $ref: "#/components/responses/ChatError" }
        "500": { $ref: "#/components/responses/ChatError" }
  /chat/conversations/{id}:
    get:
      operationId: getChatConversation
      tags: [chat]
      security: [{ sessionCookie: [] }]
      summary: Resolve an exact authorized conversation, including empty chats
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Same conversation representation as the inbox
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatConversationResult" }
        "400": { $ref: "#/components/responses/ChatError" }
        "401": { $ref: "#/components/responses/ChatError" }
        "403": { $ref: "#/components/responses/ChatError" }
        "404": { $ref: "#/components/responses/ChatError" }
        "500": { $ref: "#/components/responses/ChatError" }
  /chat/conversations/{id}/events:
    get:
      operationId: streamChatConversation
      tags: [chat]
      security: [{ sessionCookie: [] }]
      summary: Cookie-authenticated SSE for the currently open conversation
      description: |
        Backend-only Supabase INSERT subscription. chat_message data is a safe
        ChatMessage JSON object. ready signals a subscribed stream (rehydrate
        through the normal API after reconnect); access_revoked closes the stream.
        Comment heartbeats are sent approximately every 20 seconds. This is not
        a replay log; use the messages API to recover gaps.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Authorized event stream; browser EventSource handles reconnection
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/ChatError" }
        "401": { $ref: "#/components/responses/ChatError" }
        "403": { $ref: "#/components/responses/ChatError" }
        "404": { $ref: "#/components/responses/ChatError" }
        "500": { $ref: "#/components/responses/ChatError" }
  /chat/direct:
    post:
      operationId: openDirectChat
      tags: [chat]
      security: [{ sessionCookie: [] }]
      summary: Create or return the unique conversation with an accepted friend
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatDirectInput" }
      responses:
        "200":
          description: Existing conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatConversationResult" }
        "201":
          description: Conversation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatConversationResult" }
        "400": { $ref: "#/components/responses/ChatError" }
        "401": { $ref: "#/components/responses/ChatError" }
        "403": { $ref: "#/components/responses/ChatError" }
        "404": { $ref: "#/components/responses/ChatError" }
        "409": { $ref: "#/components/responses/ChatError" }
        "500": { $ref: "#/components/responses/ChatError" }
  /chat/conversations/{id}/messages:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listChatMessages
      tags: [chat]
      security: [{ sessionCookie: [] }]
      summary: Fetch the latest page or older messages; each page is returned oldest to newest
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: cursor, schema: { type: string, maxLength: 512 } }
      responses:
        "200":
          description: Cursor binds the oldest returned timestamp and ID to this conversation; own messages do not count as unread
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessagePage" }
        "400": { $ref: "#/components/responses/ChatError" }
        "401": { $ref: "#/components/responses/ChatError" }
        "403": { $ref: "#/components/responses/ChatError" }
        "404": { $ref: "#/components/responses/ChatError" }
        "500": { $ref: "#/components/responses/ChatError" }
    post:
      operationId: sendChatMessage
      tags: [chat]
      security: [{ sessionCookie: [] }]
      summary: Send as the authenticated user; direct chats require a current accepted friendship
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatMessageInput" }
      responses:
        "201":
          description: Saved message; no notification is created in this phase
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessageResult" }
        "400": { $ref: "#/components/responses/ChatError" }
        "401": { $ref: "#/components/responses/ChatError" }
        "403": { $ref: "#/components/responses/ChatError" }
        "404": { $ref: "#/components/responses/ChatError" }
        "500": { $ref: "#/components/responses/ChatError" }
  /chat/conversations/{id}/read:
    post:
      operationId: markChatRead
      tags: [chat]
      security: [{ sessionCookie: [] }]
      summary: Mark read with server time for the authenticated participant only
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Read state saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatReadResult" }
        "400": { $ref: "#/components/responses/ChatError" }
        "401": { $ref: "#/components/responses/ChatError" }
        "403": { $ref: "#/components/responses/ChatError" }
        "404": { $ref: "#/components/responses/ChatError" }
        "500": { $ref: "#/components/responses/ChatError" }
  /chat/activities/{activityId}:
    get:
      operationId: getActivityChat
      tags: [chat]
      security: [{ sessionCookie: [] }]
      summary: Return the existing activity chat for current activity members only
      parameters:
        - { in: path, name: activityId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Activity conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatConversationResult" }
        "400": { $ref: "#/components/responses/ChatError" }
        "401": { $ref: "#/components/responses/ChatError" }
        "403": { $ref: "#/components/responses/ChatError" }
        "404": { $ref: "#/components/responses/ChatError" }
        "500": { $ref: "#/components/responses/ChatError" }
  /connections/search:
    get:
      operationId: searchConnectionProfiles
      tags: [connections]
      security: [{ sessionCookie: [] }]
      summary: Find people by partial username with existing profile visibility rules
      parameters:
        - in: query
          name: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 50
      responses:
        "200":
          description: At most 20 matching profiles, excluding the viewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionSearchResults"
        "400":
          description: Invalid query
        "401":
          description: Authentication required
        "500":
          description: Search unavailable
  /activities/{id}/review:
    put:
      operationId: saveActivityReview
      tags: [activities]
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityReviewInput"
      responses:
        "200":
          description: Own review saved or updated through the existing atomic RPC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityReviewSaved"
        "400":
          description: Invalid rating or comment
        "401":
          description: Authentication required
        "403":
          description: Organizer or non-participant cannot review
        "404":
          description: Activity not found
        "409":
          description: Cancelled or unfinished activity
        "500":
          description: Database error or malformed RPC response
  /push/status:
    get:
      operationId: getPushStatus
      tags: [notifications]
      security: [{ sessionCookie: [] }]
      summary: Server configuration and ownership of this browser's optional endpoint
      parameters:
        - in: query
          name: endpoint
          required: false
          schema:
            type: string
            maxLength: 2048
      responses:
        "200":
          description: Browser permission is not inferred by the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushStatus"
        "400":
          $ref: "#/components/responses/PushFailure"
        "401":
          $ref: "#/components/responses/PushFailure"
        "503":
          $ref: "#/components/responses/PushFailure"
  /push/public-key:
    get:
      operationId: getPushPublicKey
      tags: [notifications]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Only the VAPID public key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushPublicKey"
        "401":
          $ref: "#/components/responses/PushFailure"
        "503":
          $ref: "#/components/responses/PushFailure"
  /push/subscriptions:
    post:
      operationId: registerPushSubscription
      tags: [notifications]
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionInput"
      responses:
        "200":
          description: Registered for the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscriptionResult"
        "400":
          $ref: "#/components/responses/PushFailure"
        "401":
          $ref: "#/components/responses/PushFailure"
        "409":
          $ref: "#/components/responses/PushFailure"
        "503":
          $ref: "#/components/responses/PushFailure"
    delete:
      operationId: removePushSubscription
      tags: [notifications]
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushEndpointInput"
      responses:
        "200":
          description: Endpoint removed only from this user's subscriptions; idempotent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscriptionResult"
        "400":
          $ref: "#/components/responses/PushFailure"
        "401":
          $ref: "#/components/responses/PushFailure"
        "503":
          $ref: "#/components/responses/PushFailure"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      security: [{ sessionCookie: [] }]
      summary: Latest 50 notifications for the authenticated recipient; current privacy applied
      responses:
        "200":
          description: Newest first, with privacy-safe current actors and activities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsList"
        default:
          $ref: "#/components/responses/NotificationsError"
  /notifications/unread-count:
    get:
      operationId: getNotificationsUnreadCount
      tags: [notifications]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Exact recipient-scoped unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationUnreadCount"
        default:
          $ref: "#/components/responses/NotificationsError"
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: All unread recipient-owned entries up to readAt marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationReadResult"
        default:
          $ref: "#/components/responses/NotificationsError"
  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      security: [{ sessionCookie: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Idempotent read timestamp; only recipient can write
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationReadResult"
        default:
          $ref: "#/components/responses/NotificationsError"
  /follows/with/{userId}:
    parameters:
      - $ref: "#/components/parameters/FollowUserId"
    get:
      operationId: getFollowRelationship
      tags: [follows]
      security: [{ sessionCookie: [] }]
      summary: Relationship to the target and exact target follower/following counts
      responses:
        "200":
          description: Relationship and counts, including for the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowRelationship"
        default:
          $ref: "#/components/responses/FollowError"
  /follows/{userId}:
    parameters:
      - $ref: "#/components/parameters/FollowUserId"
    post:
      operationId: followUser
      tags: [follows]
      security: [{ sessionCookie: [] }]
      summary: Idempotently follow an existing user using the session identity
      responses:
        "200":
          description: Following, including an already-existing follow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowMutationResult"
        default:
          $ref: "#/components/responses/FollowError"
    delete:
      operationId: unfollowUser
      tags: [follows]
      security: [{ sessionCookie: [] }]
      summary: Idempotently remove only the current user's follow of the target
      responses:
        "200":
          description: Not following, including an already-absent follow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowMutationResult"
        default:
          $ref: "#/components/responses/FollowError"
  /follows/{userId}/followers:
    parameters:
      - $ref: "#/components/parameters/FollowUserId"
    get:
      operationId: getFollowers
      tags: [follows]
      security: [{ sessionCookie: [] }]
      summary: Followers of the target, using the viewer's existing privacy permissions
      responses:
        "200":
          description: Safe profiles, newest follow first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowProfileList"
        default:
          $ref: "#/components/responses/FollowError"
  /follows/{userId}/following:
    parameters:
      - $ref: "#/components/parameters/FollowUserId"
    get:
      operationId: getFollowing
      tags: [follows]
      security: [{ sessionCookie: [] }]
      summary: Users followed by the target, using the viewer's existing privacy permissions
      responses:
        "200":
          description: Safe profiles, newest follow first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowProfileList"
        default:
          $ref: "#/components/responses/FollowError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Get the current authenticated session
      responses:
        "200":
          description: Current session, or an unauthenticated state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/sign-in:
    post:
      operationId: signIn
      tags: [auth]
      summary: Sign in with a username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInInput"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid credentials or input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/sign-up:
    post:
      operationId: signUp
      tags: [auth]
      summary: Register a new Outfy user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpInput"
      responses:
        "201":
          description: Registration accepted and email verification required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
        "400":
          description: Invalid registration data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Verify an email with a six-digit code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailInput"
      responses:
        "200":
          description: Verified and authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid or expired verification code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/resend-code:
    post:
      operationId: resendVerificationCode
      tags: [auth]
      summary: Resend the email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationInput"
      responses:
        "200":
          description: Verification email requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/sign-out:
    post:
      operationId: signOut
      tags: [auth]
      summary: Sign out the current user
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: outfy_access_token
  parameters:
    FollowUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
  responses:
    ChatError:
      description: Chat request rejected; code is stable and does not contain database details
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ChatErrorResponse" }
    PushFailure:
      description: Authentication, input, ownership conflict, or push unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PushError"
    NotificationsError:
      description: "400 invalid_notification; 401 authentication_required; 404 notification_not_found; 500 notifications_unavailable; 503 notifications_migration_required"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotificationErrorResponse"
    FollowError:
      description: "400 invalid_target/self_follow; 401 authentication_required; 404 user_not_found; 500 follows_unavailable; 503 follows_migration_required"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FollowErrorResponse"
  schemas:
    ChatErrorResponse:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          description: Stable code including authentication_required, invalid_conversation, invalid_activity, invalid_target, self_chat, user_not_found, chat_connection_not_accepted, chat_access_denied, chat_not_found, invalid_message_body, invalid_limit, invalid_cursor, chat_changed, chat_unavailable
    ChatDirectInput:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid }
    ChatMessageInput:
      type: object
      required: [body]
      properties:
        body:
          type: string
          description: Trimmed server-side; 1-2000 Unicode characters after trimming
    ChatProfile:
      type: object
      required: [id, username, displayName, avatarUrl]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: [string, "null"] }
        avatarUrl: { type: [string, "null"] }
    ChatLastMessage:
      type: object
      required: [id, body, senderId, createdAt]
      properties:
        id: { type: string, format: uuid }
        body: { type: string }
        senderId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
    ChatMessage:
      allOf:
        - { $ref: "#/components/schemas/ChatLastMessage" }
        - type: object
          required: [conversationId, sender]
          properties:
            conversationId: { type: string, format: uuid }
            sender:
              description: Safe profile or null if a profile is unavailable
              anyOf:
                - { $ref: "#/components/schemas/ChatProfile" }
                - { type: "null" }
    ChatActivity:
      type: object
      required: [id, title, status, category]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { type: string, enum: [active, completed, cancelled] }
        category: { type: string }
    ChatConversation:
      type: object
      required: [id, type, createdAt, updatedAt, lastMessageAt, unreadCount, lastMessage, otherUser, activity]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [direct, activity] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastMessageAt: { type: [string, "null"], format: date-time }
        unreadCount: { type: integer, minimum: 0 }
        lastMessage:
          anyOf:
            - { $ref: "#/components/schemas/ChatLastMessage" }
            - { type: "null" }
        otherUser:
          anyOf:
            - { $ref: "#/components/schemas/ChatProfile" }
            - { type: "null" }
        activity:
          anyOf:
            - { $ref: "#/components/schemas/ChatActivity" }
            - { type: "null" }
    ChatConversationResult:
      type: object
      required: [conversation]
      properties:
        conversation: { $ref: "#/components/schemas/ChatConversation" }
    ChatInboxPage:
      type: object
      required: [conversations, nextCursor]
      properties:
        conversations:
          type: array
          items: { $ref: "#/components/schemas/ChatConversation" }
        nextCursor: { type: [string, "null"] }
    ChatMessagePage:
      type: object
      required: [messages, nextCursor]
      properties:
        messages:
          type: array
          items: { $ref: "#/components/schemas/ChatMessage" }
        nextCursor: { type: [string, "null"] }
    ChatMessageResult:
      type: object
      required: [message]
      properties:
        message: { $ref: "#/components/schemas/ChatMessage" }
    ChatReadResult:
      type: object
      required: [success, readAt]
      properties:
        success: { type: boolean, enum: [true] }
        readAt: { type: string, format: date-time }
    ConnectionSearchProfile:
      type: object
      required: [id, username, displayName, avatarUrl, city]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: [string, "null"] }
        avatarUrl: { type: [string, "null"] }
        city: { type: [string, "null"] }
    ConnectionSearchResults:
      type: object
      required: [profiles]
      properties:
        profiles:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ConnectionSearchProfile"
    ActivityReviewInput:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, "null"], maxLength: 1000 }
    ActivityOwnReview:
      type: object
      required: [rating, comment]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, "null"] }
    ActivityReviewSaved:
      type: object
      required: [review, averageRating, reviewCount]
      properties:
        review:
          allOf:
            - $ref: "#/components/schemas/ActivityOwnReview"
            - type: object
              required: [id]
              properties:
                id: { type: string, format: uuid }
        averageRating: { type: [number, "null"] }
        reviewCount: { type: integer, minimum: 1 }
    PushStatus:
      type: object
      required: [configured, subscribed]
      properties:
        configured:
          type: boolean
        subscribed:
          type: boolean
    PushPublicKey:
      type: object
      required: [publicKey]
      properties:
        publicKey:
          type: string
    PushEndpointInput:
      type: object
      additionalProperties: false
      required: [endpoint]
      properties:
        endpoint:
          type: string
          minLength: 1
          maxLength: 2048
    PushSubscriptionInput:
      type: object
      additionalProperties: false
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          minLength: 1
          maxLength: 2048
        keys:
          type: object
          additionalProperties: false
          required: [p256dh, auth]
          properties:
            p256dh:
              type: string
              minLength: 87
              maxLength: 88
            auth:
              type: string
              minLength: 22
              maxLength: 24
    PushSubscriptionResult:
      type: object
      required: [subscribed]
      properties:
        subscribed:
          type: boolean
    PushError:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
    NotificationErrorResponse:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [authentication_required, invalid_notification, notification_not_found, notifications_unavailable, notifications_migration_required]
    NotificationItem:
      type: object
      required: [id, type, readAt, createdAt, metadata, actor, activity]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [connection_request, connection_accepted, activity_invitation, activity_invitation_accepted, activity_invitation_declined, activity_joined, activity_reminder, chat_message]
        readAt:
          type: [string, "null"]
        createdAt:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        actor:
          type: [object, "null"]
          required: [id, username, displayName, avatarUrl]
          properties:
            id:
              type: string
            username:
              type: string
            displayName:
              type: [string, "null"]
            avatarUrl:
              type: [string, "null"]
        activity:
          type: [object, "null"]
          required: [id, title]
          properties:
            id:
              type: string
            title:
              type: string
    NotificationsList:
      type: object
      required: [notifications]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/NotificationItem"
    NotificationUnreadCount:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          minimum: 0
    NotificationReadResult:
      type: object
      required: [readAt]
      properties:
        readAt:
          type: string
    FollowRelationship:
      type: object
      required: [isFollowing, followsYou, followersCount, followingCount]
      properties:
        isFollowing:
          type: boolean
        followsYou:
          type: boolean
        followersCount:
          type: integer
          minimum: 0
        followingCount:
          type: integer
          minimum: 0
    FollowMutationResult:
      type: object
      required: [following]
      properties:
        following:
          type: boolean
    FollowProfile:
      type: object
      additionalProperties: false
      required: [id, username, displayName, avatarUrl, city]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
    FollowProfileList:
      type: object
      required: [profiles]
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/FollowProfile"
    FollowErrorResponse:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [authentication_required, invalid_target, self_follow, user_not_found, follows_unavailable, follows_migration_required]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        homeLocation:
          oneOf:
            - $ref: "#/components/schemas/HomeLocation"
            - type: "null"
      required:
        - id
        - username
        - homeLocation
    HomeLocation:
      type: object
      properties:
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
        country:
          type: string
        regionCode:
          type: ["string", "null"]
        region:
          type: ["string", "null"]
        city:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      required:
        - countryCode
        - country
        - regionCode
        - region
        - city
        - latitude
        - longitude
    AuthSession:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
      required:
        - authenticated
        - user
    AuthMessage:
      type: object
      properties:
        message:
          type: string
        email:
          type: ["string", "null"]
      required:
        - message
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    SignInInput:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
        - username
        - password
    SignUpInput:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        email:
          type: string
          description: Valid email address
        password:
          type: string
          minLength: 8
        invitationCode:
          type: string
          minLength: 1
          description: Private invitation code required during registration
      required:
        - username
        - email
        - password
        - invitationCode
    VerifyEmailInput:
      type: object
      properties:
        email:
          type: string
          description: Valid email address
        token:
          type: string
          pattern: "^[0-9]{6}$"
      required:
        - email
        - token
    ResendVerificationInput:
      type: object
      properties:
        email:
          type: string
          description: Valid email address
      required:
        - email

