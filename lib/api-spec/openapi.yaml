openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: follows
    description: Unilateral follows; never grant friend or private-profile access
paths:
  /follows/with/{userId}:
    parameters:
      - $ref: "#/components/parameters/FollowUserId"
    get:
      operationId: getFollowRelationship
      tags: [follows]
      security: [{ sessionCookie: [] }]
      summary: Relationship to the target and exact target follower/following counts
      responses:
        "200":
          description: Relationship and counts, including for the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowRelationship"
        default:
          $ref: "#/components/responses/FollowError"
  /follows/{userId}:
    parameters:
      - $ref: "#/components/parameters/FollowUserId"
    post:
      operationId: followUser
      tags: [follows]
      security: [{ sessionCookie: [] }]
      summary: Idempotently follow an existing user using the session identity
      responses:
        "200":
          description: Following, including an already-existing follow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowMutationResult"
        default:
          $ref: "#/components/responses/FollowError"
    delete:
      operationId: unfollowUser
      tags: [follows]
      security: [{ sessionCookie: [] }]
      summary: Idempotently remove only the current user's follow of the target
      responses:
        "200":
          description: Not following, including an already-absent follow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowMutationResult"
        default:
          $ref: "#/components/responses/FollowError"
  /follows/{userId}/followers:
    parameters:
      - $ref: "#/components/parameters/FollowUserId"
    get:
      operationId: getFollowers
      tags: [follows]
      security: [{ sessionCookie: [] }]
      summary: Followers of the target, using the viewer's existing privacy permissions
      responses:
        "200":
          description: Safe profiles, newest follow first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowProfileList"
        default:
          $ref: "#/components/responses/FollowError"
  /follows/{userId}/following:
    parameters:
      - $ref: "#/components/parameters/FollowUserId"
    get:
      operationId: getFollowing
      tags: [follows]
      security: [{ sessionCookie: [] }]
      summary: Users followed by the target, using the viewer's existing privacy permissions
      responses:
        "200":
          description: Safe profiles, newest follow first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowProfileList"
        default:
          $ref: "#/components/responses/FollowError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/session:
    get:
      operationId: getAuthSession
      tags: [auth]
      summary: Get the current authenticated session
      responses:
        "200":
          description: Current session, or an unauthenticated state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
  /auth/sign-in:
    post:
      operationId: signIn
      tags: [auth]
      summary: Sign in with a username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInInput"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid credentials or input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/sign-up:
    post:
      operationId: signUp
      tags: [auth]
      summary: Register a new Outfy user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpInput"
      responses:
        "201":
          description: Registration accepted and email verification required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
        "400":
          description: Invalid registration data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Verify an email with a six-digit code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailInput"
      responses:
        "200":
          description: Verified and authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid or expired verification code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/resend-code:
    post:
      operationId: resendVerificationCode
      tags: [auth]
      summary: Resend the email verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationInput"
      responses:
        "200":
          description: Verification email requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/sign-out:
    post:
      operationId: signOut
      tags: [auth]
      summary: Sign out the current user
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: outfy_access_token
  parameters:
    FollowUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
  responses:
    FollowError:
      description: "400 invalid_target/self_follow; 401 authentication_required; 404 user_not_found; 500 follows_unavailable; 503 follows_migration_required"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FollowErrorResponse"
  schemas:
    FollowRelationship:
      type: object
      required: [isFollowing, followsYou, followersCount, followingCount]
      properties:
        isFollowing:
          type: boolean
        followsYou:
          type: boolean
        followersCount:
          type: integer
          minimum: 0
        followingCount:
          type: integer
          minimum: 0
    FollowMutationResult:
      type: object
      required: [following]
      properties:
        following:
          type: boolean
    FollowProfile:
      type: object
      additionalProperties: false
      required: [id, username, displayName, avatarUrl, city]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
    FollowProfileList:
      type: object
      required: [profiles]
      properties:
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/FollowProfile"
    FollowErrorResponse:
      type: object
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [authentication_required, invalid_target, self_follow, user_not_found, follows_unavailable, follows_migration_required]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        homeLocation:
          oneOf:
            - $ref: "#/components/schemas/HomeLocation"
            - type: "null"
      required:
        - id
        - username
        - homeLocation
    HomeLocation:
      type: object
      properties:
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
        country:
          type: string
        regionCode:
          type: ["string", "null"]
        region:
          type: ["string", "null"]
        city:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      required:
        - countryCode
        - country
        - regionCode
        - region
        - city
        - latitude
        - longitude
    AuthSession:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
      required:
        - authenticated
        - user
    AuthMessage:
      type: object
      properties:
        message:
          type: string
        email:
          type: ["string", "null"]
      required:
        - message
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    SignInInput:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
        - username
        - password
    SignUpInput:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        email:
          type: string
          description: Valid email address
        password:
          type: string
          minLength: 8
        invitationCode:
          type: string
          minLength: 1
          description: Private invitation code required during registration
      required:
        - username
        - email
        - password
        - invitationCode
    VerifyEmailInput:
      type: object
      properties:
        email:
          type: string
          description: Valid email address
        token:
          type: string
          pattern: "^[0-9]{6}$"
      required:
        - email
        - token
    ResendVerificationInput:
      type: object
      properties:
        email:
          type: string
          description: Valid email address
      required:
        - email

